# Render 部署設定（Docker 模式）
# 單一服務：Go backend 同時 serve Vue frontend（從 /static 目錄）
# 需要 Starter ($7/月) 才能正常跑 WebSocket（Free 方案 30 秒強制斷線）

services:
  - type: web
    name: kahoot-game
    runtime: docker
    plan: starter
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: GIN_MODE
        value: release
      - key: DB_HOST
        value: skip        # 記憶體模式（不需要 PostgreSQL）
      - key: CORS_ORIGINS
        sync: false        # 在 Render Dashboard 填入你的網域，例如 https://kahoot-game.onrender.com
