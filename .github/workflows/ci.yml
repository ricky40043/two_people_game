name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kahoot-game/backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Verify dependencies
      run: go mod verify

    - name: Run Tests
      # 全部測試都不需要外部依賴：服務層傳 nil redis/db 會走記憶體模式。
      # 其中 internal/websocket 是整場遊戲的整合測試
      # （1 房 + 5 玩家 + 5 題，過程含隨機斷線重連），約需 3~5 秒。
      run: go test -v -timeout 5m ./...

    - name: Build
      run: go build -v -o app cmd/main.go

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kahoot-game/frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./kahoot-game/frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
